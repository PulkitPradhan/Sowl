[project]
name = "sowl"
version = "0.1.0"
description = "Local-first personal AI agent: daemon + thin CLI/popup clients, built for low-spec machines"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",  # Unified asynchronous HTTP and WebSocket server without external ASGI runner
    "httpx>=0.28.1",
    "psutil>=7.2.2",  # Cross-platform RAM and system hardware detection for ag doctor
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",  # YAML configuration parser for profiles/*.yaml
    "toon-format>=1.2.0",  # Official TOON specification 4.4 serializer for token reduction
    "typer>=0.27.3",
]

[project.optional-dependencies]
tokens = [
    "tiktoken>=0.9.0",  # Fast BPE token counter for ag wire --count
]

[project.scripts]
ag = "ag.client.cli:main"
agentd = "ag.daemon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Project name is "sowl" but the import package is "ag": hatchling must be told where it lives.
[tool.hatch.build.targets.wheel]
packages = ["src/ag"]

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I"]
