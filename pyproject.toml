[project]
name = "sowl"
version = "0.1.0"
description = "Local-first personal AI agent: daemon + thin CLI/popup clients, built for low-spec machines"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
ag = "ag.client.cli:main"
agentd = "ag.daemon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Project name is "sowl" but the import package is "ag": hatchling must be told where it lives.
[tool.hatch.build.targets.wheel]
packages = ["src/ag"]

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I"]
