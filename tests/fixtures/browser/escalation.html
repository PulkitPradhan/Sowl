<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Escalation and Engagement Test</title>
</head>
<body>
  <h1>Action Triggers</h1>
  <div>
    <!-- R2 escalation buttons -->
    <button id="btn-send">Send Message</button>
    <button id="btn-checkout">Checkout Now</button>
    <button id="btn-delete">Delete Account</button>
    <button id="btn-place-order">Place Order</button>
    <button id="btn-pay">Pay Invoice</button>
    <button id="btn-transfer">Transfer Funds</button>
    
    <!-- Regular R1 buttons -->
    <button id="btn-view">View Details</button>
    <button id="btn-refresh">Refresh List</button>

    <!-- Social engagement triggers -->
    <button id="btn-like">Like</button>
    <button id="btn-follow">Follow</button>
    <button id="btn-comment">Comment</button>
    <input type="text" id="comment-box" placeholder="Write a comment..." />
  </div>
</body>
</html>
